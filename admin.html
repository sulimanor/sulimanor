<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — SuliManor Collection</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="seal lg" style="margin:0 auto;">SM</div>
    <h1>Admin Sign In</h1>
    <p class="sub">SuliManor Collection — staff only</p>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
      <p class="login-error" id="login-error"></p>
    </form>
  </div>
</div>

<div class="admin-shell" id="admin-shell" style="display:none;">
  <div class="admin-header">
    <div class="brand">
      <div class="seal">SM</div>
      <div class="brand-name">Suli<em>Manor</em> — Admin</div>
    </div>
    <button class="btn btn-outline" id="logout-btn" style="border-color:var(--gold-soft); color:var(--ivory);">Sign Out</button>
  </div>

  <div class="admin-card">
    <h2>Add a New Product</h2>
    <form id="product-form" class="form-grid">
      <div class="field"><label>Name</label><input type="text" id="p-name" required></div>
      <div class="field"><label>Price</label><input type="number" step="0.01" id="p-price" required></div>
      <div class="field"><label>Category (optional)</label><input type="text" id="p-category" placeholder="e.g. Dresses"></div>
      <div class="field">
        <label>Photo</label>
        <div class="image-drop" id="image-drop">Tap to choose a photo</div>
        <input type="file" id="p-image-file" accept="image/*" style="display:none;">
        <img id="image-preview" class="image-preview" style="display:none;">
      </div>
      <div class="field full"><label>Notes (optional, admin-only)</label><textarea id="p-notes"></textarea></div>
      <div class="full">
        <button type="submit" class="btn btn-primary" id="save-product-btn">Add Product</button>
      </div>
    </form>
  </div>

  <div class="admin-card">
    <h2>Manage Catalog</h2>
    <div class="table-wrap">
      <table class="products-table">
        <thead>
          <tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="products-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/shop-settings.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
